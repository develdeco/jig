findings:
  - id: retry-non-idempotent
    file: netutil/retry.go
    lines: [8, 18]
    action: ask
    description: Retry retries every failure without distinguishing a request that may already have taken effect before it failed, such as one that creates a record; this needs a human decision on whether repeating it automatically is safe, not a silent default.
