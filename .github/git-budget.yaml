# The threshold CI's Linux leg holds each package's git process count to.
# internal/gitbudget (go test -exec) counts the processes git traces for
# every package, and compares each count with main's last measured one: the
# counts live in the Actions cache, saved by the push run on main, not here.
# A count above its baseline plus the larger of margin percent of the
# baseline (rounded up) and slack processes fails the leg; a decrease never
# does. A real increase is accepted with the pull request label
# git-budget-accepted, and the failed job re-run.
margin: 5
slack: 100
