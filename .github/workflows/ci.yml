name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Also build the release archives and run them through the installers and the hooks test
        type: boolean
        default: false
  # Daily, for the claude-cli job below: the CLI release it tests can change
  # with no change to jig at all.
  schedule:
    - cron: "37 9 * * *"

concurrency:
  # A pull request's newer push cancels the run of its older one, whose
  # result nobody needs. Every other run - a push to main, the daily run, a
  # dispatch, a release's call - is a group of its own, by its run id, and
  # always finishes: main is where Windows tests each merge, so a merge's run
  # is its only Windows verdict. A group shared by main's pushes cancels it at
  # the next merge, and one that waits instead keeps a single run pending and
  # drops it at the merge after (DECISIONS.md, "Every run on main finishes").
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Which jobs and test legs this run needs. A pull request runs the test
  # job on Linux and macOS, and on Windows too only when it changes what
  # Windows builds or runs differently: a _windows Go file or one with a
  # build constraint, go.mod or go.sum, .gitattributes, or a workflow. A
  # pull request that changes only docs (markdown at the root or in .github,
  # docs/, LICENSE), which no test reads but lint's, tests ./lint alone and
  # skips claude-cli. Every other event - a push to main, the daily
  # schedule, a dispatch, a release's call - runs everything on all three.
  # The Windows legs take 15 to 18 minutes, Linux and macOS 2 to 4, so a
  # Windows-only failure is found on main within the half hour after its
  # merge and fixed forward (DECISIONS.md, "Pull requests test on Linux and
  # macOS"). lint/workflow_test.go runs this job's step with synthetic
  # changes.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      os: ${{ steps.plan.outputs.os }}
      windows: ${{ steps.plan.outputs.windows }}
      docs: ${{ steps.plan.outputs.docs }}
    steps:
      # A pull request's run checks out its merge commit, whose first parent
      # is the base branch's tip: the two name the files it changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: plan the run
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          windows=true
          docs=false
          if [ "$EVENT" = pull_request ]; then
            windows=false
            # CHANGED_FILES, one path a line, stands in for the diff in the
            # lint test of this step.
            if [ -n "${CHANGED_FILES+set}" ]; then
              changed=$CHANGED_FILES
            else
              changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
            fi
            docs=true
            any=false
            while IFS= read -r f; do
              case "$f" in
                "") continue ;;
                docs/* | .github/*.md | LICENSE) ;;
                */*) docs=false ;;
                *.md) ;;
                *) docs=false ;;
              esac
              any=true
              case "$f" in
                *_windows.go | *_windows_*.go | go.mod | go.sum | .gitattributes | .github/workflows/*)
                  windows=true ;;
                *.go)
                  if [ -f "$f" ] && grep -q '^//go:build ' "$f"; then
                    windows=true
                  fi ;;
              esac
            done <<< "$changed"
            if [ "$any" = false ]; then
              docs=false
            fi
            if [ "$docs" = true ]; then
              windows=false
            fi
          fi
          if [ "$windows" = true ]; then
            os='["windows-latest", "ubuntu-latest", "macos-latest"]'
          else
            os='["ubuntu-latest", "macos-latest"]'
          fi
          {
            echo "windows=$windows"
            echo "os=$os"
            echo "docs=$docs"
          } >> "$GITHUB_OUTPUT"
          echo "test legs: $os; docs only: $docs"

  # Named in full so no matrix key beyond os can reach the check names main's
  # ruleset requires: test (ubuntu-latest) and test (macos-latest), which
  # every pull request reports. lint/workflow_test.go checks them.
  test:
    name: test (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: actionlint
        if: runner.os == 'Linux'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # Most Windows users run git through Git for Windows' launcher
      # (cmd\git.exe or bin\git.exe), so gitx's own tests run through it
      # first, before the next step takes it off the path for the suite.
      - name: gitx through Git for Windows' launcher
        if: runner.os == 'Windows'
        run: go test -count=1 ./internal/gitx
      # The runner's first git on PATH is Git for Windows' bin\git.exe, a
      # launcher that starts git's own git.exe as a second process on every
      # one of the suite's git calls. git --exec-path names the directory
      # holding git's own binary; put it first. pwsh runs with MSYSTEM unset,
      # so git.exe still adds its mingw64\bin and usr\bin to the PATH of the
      # hooks and helpers it starts; unlike the launcher, it adds them after
      # %HOME%\bin, which the runner does not have.
      - name: git's own binary first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: (git --exec-path) -replace '/', '\' | Add-Content -Path $env:GITHUB_PATH
      # The packages to test: go list ./... less SKIP_PACKAGE, the package
      # the Windows leg leaves to a job of its own (windows-verifydeliver,
      # below); every other leg tests every package. lint/workflow_test.go
      # checks that a job tests each skipped package on the same OS.
      # go test starts packages in the order it is given them, a few at a
      # time, and go list orders them by import path. Putting the
      # longest-running package first once saved the Windows step 10%, but
      # that package, verifydeliver, is the one that leg now skips, and the
      # other legs end in about 200 s and 400 s, far under Windows. The step
      # fails when go list does (bash runs it with -e), when the skipped
      # package is not named exactly once (a renamed package would be tested
      # by no job), and when no package is left. A docs-only pull request
      # tests ./lint alone, the one package whose tests read the docs.
      - name: list the packages to test
        id: packages
        shell: bash
        env:
          SKIP_PACKAGE: ${{ runner.os == 'Windows' && 'github.com/develdeco/jig/internal/verifydeliver' || '' }}
          DOCS_ONLY: ${{ needs.plan.outputs.docs }}
        run: |
          packages=$(go list ./...)
          if [ "$DOCS_ONLY" = true ]; then
            packages=$(go list ./lint)
          fi
          if [ -n "$SKIP_PACKAGE" ]; then
            found=$(printf '%s\n' "$packages" | awk '$0 == ENVIRON["SKIP_PACKAGE"] { n++ } END { print n + 0 }')
            if [ "$found" -ne 1 ]; then
              echo "go list ./... names $SKIP_PACKAGE $found times, want once"
              exit 1
            fi
            packages=$(printf '%s\n' "$packages" | awk '$0 != ENVIRON["SKIP_PACKAGE"]')
          fi
          if [ -z "$packages" ]; then
            echo "no package to test"
            exit 1
          fi
          printf '%s\n' "$packages"
          echo "list=$(printf '%s\n' "$packages" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      # The Linux leg runs every test binary through internal/gitbudget,
      # which counts the git processes each package's tests start, and holds
      # the counts to .github/git-budget.yaml: a change that adds git work to
      # the suite raises its package's number there in its own diff, and a
      # cut lowers it. Counted on Linux only, where a trace file costs
      # nothing; the count is the same work on every OS.
      - name: build the git process counter
        if: runner.os == 'Linux'
        run: go build -o "$RUNNER_TEMP/gitbudget" ./internal/gitbudget
      # Every leg runs go test with -count=1, as every go test in the
      # workflows does: a cacheable run has each test binary log every file
      # its tests open or stat, and go test checks that log path by path
      # after the binary exits, for a result no run here reuses (setup-go
      # saves its cache once per go.sum, and no Windows run on main reused
      # one). That check was 110-210 s of windows-verifydeliver's step
      # (DECISIONS.md, "No go test in CI caches its result").
      - name: go test
        env:
          GITBUDGET_DIR: ${{ runner.os == 'Linux' && format('{0}/gitcount', runner.temp) || '' }}
        run: go test -count=1 -timeout 30m ${{ runner.os == 'Linux' && format('-exec={0}/gitbudget', runner.temp) || '' }} ${{ steps.packages.outputs.list }}
      - name: git processes against the budget
        if: runner.os == 'Linux'
        run: |
          "$RUNNER_TEMP/gitbudget" check .github/git-budget.yaml "$RUNNER_TEMP/gitcount" ${{ steps.packages.outputs.list }}

  # The package the test job's Windows leg skips, on a Windows runner of its
  # own. It is one of the leg's two longest (843 s, beside cmd/jig's 852 s,
  # in a step of 1,050-1,110 s) and the floor once the in-flight diets of
  # cmd/jig, e2e and revieweval land; until then cmd/jig bounds the
  # step and the saving does not show. A package alone on the runner runs
  # faster than inside a shared step (gitx: 61 s alone, 149 s in the full
  # step). It runs when the test job's Windows leg does. Main's ruleset does
  # not require this check by name: ci ok needs it, as it needs every job
  # that runs on pull requests.
  windows-verifydeliver:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The test job's step of this name, for the reason given there.
      - name: git's own binary first on PATH
        shell: pwsh
        run: (git --exec-path) -replace '/', '\' | Add-Content -Path $env:GITHUB_PATH
      - run: go test -count=1 -timeout 30m ./internal/verifydeliver

  # This job runs the real Claude Code CLI, at the latest release (the one
  # users' CLIs update to), with jig's hooks installed, against a scripted
  # Messages API on loopback: no credentials, and no network past the
  # install. The hook JSON jig prints is what the CLI reads, and the CLI can
  # change it with no change to jig, so nothing but the real CLI proves the
  # two still agree (TestHooksLive).
  claude-cli:
    needs: plan
    if: needs.plan.outputs.docs == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install the Claude Code CLI
        if: runner.os != 'Windows'
        # bash, not the default shell, for pipefail: a failed download
        # fails here rather than as a missing claude one step later.
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install the Claude Code CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) latest
          Join-Path $env:USERPROFILE '.local\bin' | Add-Content -Path $env:GITHUB_PATH
      - run: claude --version
      - name: the hooks against the real CLI
        env:
          JIG_LIVE_CLAUDE: "1"
        run: go test -count=1 -timeout 20m -run TestHooksLive -v ./e2e

  # Main's ruleset requires this check beside the test job's Linux and
  # macOS legs, which run the lint test that keeps this job's shape. It
  # passes only when every job it needs succeeded, so a job added to its
  # needs - another agent CLI's contract check, say - gates merges with no
  # ruleset edit. always(): a skipped required check counts as passing, so
  # this job must run, and fail, when a job it needs failed or was
  # cancelled. RESULTS holds one result per needed job. A job the plan
  # leaves out of a run is skipped, and counts as succeeded only when the
  # plan's output says it was left out, never when the plan failed.
  ci-ok:
    name: ci ok
    if: always()
    needs: [plan, test, windows-verifydeliver, claude-cli]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: every needed job succeeded
        env:
          RESULTS: >-
            ${{ needs.plan.result }}
            ${{ needs.test.result }}
            ${{ needs.windows-verifydeliver.result == 'skipped' && needs.plan.outputs.windows == 'false' && 'success' || needs.windows-verifydeliver.result }}
            ${{ needs.claude-cli.result == 'skipped' && needs.plan.outputs.docs == 'true' && 'success' || needs.claude-cli.result }}
        run: |
          echo "needed jobs: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "no needed job results"
            exit 1
          fi
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "a needed job ended $r"
              exit 1
            fi
          done

  # The release archives GoReleaser builds, installed by the installers and
  # run through the hooks test on each platform: on a manual dispatch, and
  # in every release before anything is published.
  snapshot:
    if: github.event_name == 'workflow_dispatch' || inputs.release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: verify checksums
        run: |
          set -eu
          cd dist
          sha256sum -c checksums.txt
      - name: verify version stamp
        id: verify
        run: |
          set -eu
          bin=$(find dist -type f -path '*linux_amd64*' -name jig | head -n1)
          if [ -z "$bin" ]; then
            echo "no linux/amd64 jig binary found under dist/"
            exit 1
          fi
          chmod +x "$bin"
          out=$("$bin" version)
          echo "$out"
          ver=$(printf '%s\n' "$out" | awk '/^[[:space:]]+version:/ {print $2}')
          commit=$(printf '%s\n' "$out" | awk '/^[[:space:]]+commit:/ {print $2}')
          echo "parsed version: $ver"
          echo "parsed commit: $commit"
          want_commit=$(git rev-parse HEAD | cut -c1-12)
          if [ "$commit" != "$want_commit" ]; then
            echo "unexpected commit: $commit (want $want_commit)"
            exit 1
          fi
          case "$ver" in
            *+dirty)
              echo "version reports a dirty build: $ver"
              exit 1
              ;;
          esac
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  installers:
    needs: snapshot
    if: github.event_name == 'workflow_dispatch' || inputs.release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      EXPECTED_VERSION: ${{ needs.snapshot.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: install via install.sh
        if: runner.os != 'Windows'
        shell: sh
        env:
          JIG_INSTALL_DIR: ${{ runner.temp }}/jig-install
        run: |
          set -eu
          JIG_RELEASE_URL="file://$(pwd)/dist" sh scripts/install.sh
          "$JIG_INSTALL_DIR/jig" version
          "$JIG_INSTALL_DIR/jig" version | grep -Fxq "  version: $EXPECTED_VERSION" || {
            echo "installed jig version does not match $EXPECTED_VERSION"
            exit 1
          }
      - name: install via install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        env:
          JIG_INSTALL_DIR: ${{ runner.temp }}\jig-install
        run: |
          $distPath = (Resolve-Path dist).Path -replace '\\', '/'
          $env:JIG_RELEASE_URL = "file:///$distPath"
          & .\scripts\install.ps1
          $out = & "$env:JIG_INSTALL_DIR\jig.exe" version
          $out
          if (-not ($out -match "(?m)^\s*version: $([regex]::Escape($env:EXPECTED_VERSION))$")) {
            Write-Error "installed jig version does not match $env:EXPECTED_VERSION"
            exit 1
          }
      - name: install the Claude Code CLI
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install the Claude Code CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) latest
          Join-Path $env:USERPROFILE '.local\bin' | Add-Content -Path $env:GITHUB_PATH
      - run: claude --version
      - name: the hooks of the installed jig against the real CLI
        env:
          JIG_LIVE_CLAUDE: "1"
          JIG_E2E_BINARY: ${{ runner.temp }}/jig-install/jig${{ runner.os == 'Windows' && '.exe' || '' }}
        run: go test -count=1 -timeout 20m -run TestHooksLive -v ./e2e
