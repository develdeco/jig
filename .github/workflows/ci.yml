name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Also build the release archives and run them through the installers and the Quickstart
        type: boolean
        default: false
  # Daily, for the claude-cli job below: the CLI release it tests can change
  # with no change to jig at all.
  schedule:
    - cron: "37 9 * * *"

concurrency:
  # Include the event so a manual run on a tag never shares a group with
  # release.yml's call to this workflow, which cancel-in-progress would kill.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named in full so no matrix key beyond os can reach the check names main's
  # ruleset requires: test (windows-latest), test (ubuntu-latest) and
  # test (macos-latest). lint/workflow_test.go checks them.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          # A package a leg leaves to a job of its own, because it alone takes
          # most of the leg's time: windows-verifydeliver, below. Every other
          # leg tests every package. lint/workflow_test.go checks that a job
          # tests each skipped package on the same OS and that ci ok needs it.
          - os: windows-latest
            skip-package: github.com/develdeco/jig/internal/verifydeliver
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: actionlint
        if: runner.os == 'Linux'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # Most Windows users run git through Git for Windows' launcher
      # (cmd\git.exe or bin\git.exe), so gitx's own tests run through it
      # first, before the next step takes it off the path for the suite.
      - name: gitx through Git for Windows' launcher
        if: runner.os == 'Windows'
        run: go test -count=1 ./internal/gitx
      # The runner's first git on PATH is Git for Windows' bin\git.exe, a
      # launcher that starts git's own git.exe as a second process on every
      # one of the suite's git calls. git --exec-path names the directory
      # holding git's own binary; put it first. pwsh runs with MSYSTEM unset,
      # so git.exe still adds its mingw64\bin and usr\bin to the PATH of the
      # hooks and helpers it starts; unlike the launcher, it adds them after
      # %HOME%\bin, which the runner does not have.
      - name: git's own binary first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: (git --exec-path) -replace '/', '\' | Add-Content -Path $env:GITHUB_PATH
      # The packages to test: go list ./... less the matrix's skip-package.
      # go test starts packages in the order it is given them, a few at a
      # time, and go list orders them by import path. Putting the
      # longest-running package first once saved the Windows step 10%, but
      # that package, verifydeliver, is the one that leg now skips, and the
      # other legs end in about 200 s and 400 s, far under Windows. The step
      # fails when go list does (bash runs it with -e), when the skipped
      # package is not named exactly once (a renamed package would be tested
      # by no job), and when no package is left.
      - name: list the packages to test
        id: packages
        shell: bash
        env:
          SKIP_PACKAGE: ${{ matrix.skip-package }}
        run: |
          packages=$(go list ./...)
          if [ -n "$SKIP_PACKAGE" ]; then
            found=$(printf '%s\n' "$packages" | awk '$0 == ENVIRON["SKIP_PACKAGE"] { n++ } END { print n + 0 }')
            if [ "$found" -ne 1 ]; then
              echo "go list ./... names $SKIP_PACKAGE $found times, want once"
              exit 1
            fi
            packages=$(printf '%s\n' "$packages" | awk '$0 != ENVIRON["SKIP_PACKAGE"]')
          fi
          if [ -z "$packages" ]; then
            echo "no package to test"
            exit 1
          fi
          printf '%s\n' "$packages"
          echo "list=$(printf '%s\n' "$packages" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: go test
        run: go test -timeout 30m ${{ steps.packages.outputs.list }}

  # The package the test job's Windows leg skips, on a Windows runner of its
  # own. It is the longest package there (843 s of the leg's 1,050-1,110 s),
  # already parallel inside, and a package alone on the runner runs faster
  # than inside a shared step (gitx: 61 s alone, 149 s in the full step).
  # Main's ruleset does not require its check by name: ci ok needs it, as it
  # needs every job that runs on pull requests.
  windows-verifydeliver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The test job's step of this name, for the reason given there.
      - name: git's own binary first on PATH
        shell: pwsh
        run: (git --exec-path) -replace '/', '\' | Add-Content -Path $env:GITHUB_PATH
      - run: go test -timeout 30m ./internal/verifydeliver

  # The test job's sessions run against a stub `claude` that accepts any
  # argv. This job runs the real Claude Code CLI, at the latest release (the
  # one users' CLIs update to), through jig's headless backend against a
  # scripted Messages API on loopback: no credentials, and no network past
  # the install. v0.1.1 shipped with an argv the CLI refuses, so none of its
  # headless sessions ever started, and nothing before this job ran one.
  claude-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install the Claude Code CLI
        if: runner.os != 'Windows'
        # bash, not the default shell, for pipefail: a failed download
        # fails here rather than as a missing claude one step later.
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install the Claude Code CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) latest
          Join-Path $env:USERPROFILE '.local\bin' | Add-Content -Path $env:GITHUB_PATH
      - run: claude --version
      - name: headless backend and the Quickstart against the real CLI
        env:
          JIG_LIVE_CLAUDE: "1"
        run: go test -count=1 -timeout 20m -run Live -v ./internal/session ./e2e

  # Main's ruleset requires this check beside the test job's legs, which
  # run the lint test that keeps this job's shape. It passes only when every
  # job it needs succeeded, so a job added to its needs - another agent
  # CLI's contract check, say - gates merges with no ruleset edit. always():
  # a skipped required check counts as passing, so this job must run, and
  # fail, when a job it needs failed or was cancelled.
  ci-ok:
    name: ci ok
    if: always()
    needs: [test, windows-verifydeliver, claude-cli]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed jobs: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "no needed job results"
            exit 1
          fi
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "a needed job ended $r"
              exit 1
            fi
          done

  # The release archives GoReleaser builds, installed by the installers and
  # run through the Quickstart on each platform: on a manual dispatch, and
  # in every release before anything is published.
  snapshot:
    if: github.event_name == 'workflow_dispatch' || inputs.release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: verify checksums
        run: |
          set -eu
          cd dist
          sha256sum -c checksums.txt
      - name: verify version stamp
        id: verify
        run: |
          set -eu
          bin=$(find dist -type f -path '*linux_amd64*' -name jig | head -n1)
          if [ -z "$bin" ]; then
            echo "no linux/amd64 jig binary found under dist/"
            exit 1
          fi
          chmod +x "$bin"
          out=$("$bin" version)
          echo "$out"
          ver=$(printf '%s\n' "$out" | awk '/^[[:space:]]+version:/ {print $2}')
          commit=$(printf '%s\n' "$out" | awk '/^[[:space:]]+commit:/ {print $2}')
          echo "parsed version: $ver"
          echo "parsed commit: $commit"
          want_commit=$(git rev-parse HEAD | cut -c1-12)
          if [ "$commit" != "$want_commit" ]; then
            echo "unexpected commit: $commit (want $want_commit)"
            exit 1
          fi
          case "$ver" in
            *+dirty)
              echo "version reports a dirty build: $ver"
              exit 1
              ;;
          esac
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  installers:
    needs: snapshot
    if: github.event_name == 'workflow_dispatch' || inputs.release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      EXPECTED_VERSION: ${{ needs.snapshot.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: install via install.sh
        if: runner.os != 'Windows'
        shell: sh
        env:
          JIG_INSTALL_DIR: ${{ runner.temp }}/jig-install
        run: |
          set -eu
          JIG_RELEASE_URL="file://$(pwd)/dist" sh scripts/install.sh
          "$JIG_INSTALL_DIR/jig" version
          "$JIG_INSTALL_DIR/jig" version | grep -Fxq "  version: $EXPECTED_VERSION" || {
            echo "installed jig version does not match $EXPECTED_VERSION"
            exit 1
          }
      - name: install via install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        env:
          JIG_INSTALL_DIR: ${{ runner.temp }}\jig-install
        run: |
          $distPath = (Resolve-Path dist).Path -replace '\\', '/'
          $env:JIG_RELEASE_URL = "file:///$distPath"
          & .\scripts\install.ps1
          $out = & "$env:JIG_INSTALL_DIR\jig.exe" version
          $out
          if (-not ($out -match "(?m)^\s*version: $([regex]::Escape($env:EXPECTED_VERSION))$")) {
            Write-Error "installed jig version does not match $env:EXPECTED_VERSION"
            exit 1
          }
      - name: install the Claude Code CLI
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install the Claude Code CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) latest
          Join-Path $env:USERPROFILE '.local\bin' | Add-Content -Path $env:GITHUB_PATH
      - run: claude --version
      - name: Quickstart with the installed jig
        env:
          JIG_LIVE_CLAUDE: "1"
          JIG_E2E_BINARY: ${{ runner.temp }}/jig-install/jig${{ runner.os == 'Windows' && '.exe' || '' }}
        run: go test -count=1 -timeout 20m -run TestQuickstartLive -v ./e2e
