# jig's own build surface, for tickets jig builds on this repo.
# The test oracle is the detected Go default with a longer per-package
# timeout: on a loaded machine, cmd/jig and internal/frontier run past
# go test's 10-minute default. 25m stays under jig's 30-minute bound on an
# oracle run, so a hung test still fails with go test's own message naming it.
# -count=1 because jig runs an oracle in a fresh worktree of the commit, where
# go test's cached result is never reused, while a cacheable run still has each
# test binary log every file its tests open or stat and checks that log path by
# path after the binary exits. That check cost more than some packages' tests;
# CI runs every go test with -count=1 for the same reason.
oracles:
  test: go test -count=1 -timeout 25m ./...
# The whole-suite oracle takes the project's one suite slot, so two suites do
# not run at once on one machine.
heavy: [test]
# A delta of Markdown alone cannot change what the suite proves, except for the
# tests that read it: ./lint reads the docs and skills, internal/screen reads
# ARCHITECTURE.md. A commit whose files all match runs these in the suite's
# place after a whole-suite pass.
light:
  paths:
    - "*.md"
    - ".github/*.md"
    - "docs/**/*.md"
  oracle: go test -count=1 ./lint ./internal/screen
